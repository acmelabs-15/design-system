name: publish-package

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      prepare_only:
        description: Sign verified archives without publishing package versions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
  publish:
    needs: verify
    # Keep disabled until Linux, trusted-publisher policy and real signing are verified.
    if: vars.ACME_RELEASE_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: publish-package
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: .artifacts/release/
          digest-mismatch: error
      - name: Validate exact tag, commit and archive bytes
        run: bun scripts/release.ts validate
      - name: Publish reviewed archives through npm OIDC and provenance
        if: inputs.prepare_only != true
        env:
          ACME_RELEASE_ENABLED: ${{ vars.ACME_RELEASE_ENABLED }}
        run: bun scripts/release.ts publish
      - name: Sign reviewed archives for authenticated first publication
        if: inputs.prepare_only == true
        env:
          ACME_RELEASE_ENABLED: ${{ vars.ACME_RELEASE_ENABLED }}
        run: bun scripts/release-attest.ts sign
      - name: Save signed archives
        if: inputs.prepare_only == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-${{ github.sha }}
          include-hidden-files: true
          path: |
            .artifacts/release/release.json
            .artifacts/release/archives/
            .artifacts/release/provenance/
          if-no-files-found: error
