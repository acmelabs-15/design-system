name: publish-package

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
  publish:
    needs: verify
    # Keep disabled until Linux, trusted-publisher policy and real signing are verified.
    if: vars.ACME_RELEASE_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: publish-package
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: .artifacts/release/
          digest-mismatch: error
      - name: Validate exact tag, commit and archive bytes
        run: bun scripts/release.ts validate
      - name: Publish reviewed archives through npm OIDC and provenance
        env:
          ACME_RELEASE_ENABLED: ${{ vars.ACME_RELEASE_ENABLED }}
        run: bun scripts/release.ts publish
